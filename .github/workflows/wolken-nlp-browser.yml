name: Wolken NLP browser

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tests/**
      - playwright.config.ts
      - package.json
      - package-lock.json
      - .github/workflows/wolken-nlp-browser.yml
  pull_request:
    paths:
      - tests/**
      - playwright.config.ts
      - package.json
      - package-lock.json
      - .github/workflows/wolken-nlp-browser.yml

jobs:
  nlp-parse:
    name: Parse NLP case
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npx playwright test --grep "parses"

  create-case:
    name: Execute NLP in Chromium
    needs: nlp-parse
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Wolken secrets
        env:
          WOLKEN_USER: ${{ secrets.WOLKEN_USER }}
          WOLKEN_PASSWORD: ${{ secrets.WOLKEN_PASSWORD }}
        run: |
          if [ -z "$WOLKEN_USER" ] || [ -z "$WOLKEN_PASSWORD" ]; then
            echo "Add repository secrets WOLKEN_USER and WOLKEN_PASSWORD (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Run NLP case in a headed browser
        env:
          CI: true
          HEADED: "true"
          WOLKEN_USER: ${{ secrets.WOLKEN_USER }}
          WOLKEN_PASSWORD: ${{ secrets.WOLKEN_PASSWORD }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1400x900x24" npx playwright test --headed --grep-invert "parses"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
