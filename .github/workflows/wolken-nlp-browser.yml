name: Wolken NLP browser

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tests/**
      - playwright.config.ts
      - package.json
      - package-lock.json
      - .github/workflows/wolken-nlp-browser.yml
  pull_request:
    paths:
      - tests/**
      - playwright.config.ts
      - package.json
      - package-lock.json
      - .github/workflows/wolken-nlp-browser.yml

jobs:
  nlp-parse:
    name: Parse NLP case
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npx playwright test --grep "splits"

  create-case:
    name: Execute NLP in Chromium
    needs: nlp-parse
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Require secrets
        env:
          WOLKEN_USER: ${{ secrets.WOLKEN_USER }}
          WOLKEN_PASSWORD: ${{ secrets.WOLKEN_PASSWORD }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -z "$WOLKEN_USER" ] || [ -z "$WOLKEN_PASSWORD" ] || [ -z "$CURSOR_API_KEY" ]; then
            echo "Add repository secrets WOLKEN_USER, WOLKEN_PASSWORD, and CURSOR_API_KEY."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Run NLP case in a headed browser
        env:
          CI: true
          HEADED: "true"
          WOLKEN_USER: ${{ secrets.WOLKEN_USER }}
          WOLKEN_PASSWORD: ${{ secrets.WOLKEN_PASSWORD }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_CLOUD_MODEL: ${{ vars.CURSOR_CLOUD_MODEL }}
          CURSOR_CLOUD_REPO: https://github.com/${{ github.repository }}.git
          CURSOR_CLOUD_REF: ${{ github.sha }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1400x900x24" npx playwright test --headed --grep-invert "splits"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
